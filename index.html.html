:root{--bg:#f4f7fb;--surface:#fff;--ink:#16243b;--muted:#60728a;--line:#dfe6f0;--accent:#2858a6;--accent2:#eaf1fc;--good:#18744f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}.aside{background:#14233b;color:white;padding:25px 19px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;letter-spacing:.01em;font-size:21px;line-height:1.25}.brand small{display:block;font-size:11px;color:#aabdd6;margin-top:7px;font-weight:500}.side-title{font-size:11px;text-transform:uppercase;color:#93a9c8;letter-spacing:.12em;margin:27px 8px 9px}.navbtn{width:100%;border:0;background:transparent;color:#d6e0f0;padding:10px 13px;border-radius:10px;text-align:left;display:flex;justify-content:space-between;gap:7px;align-items:center}.navbtn.active,.navbtn:hover{background:#2a4368;color:white}.navbtn em{font-size:11px;color:#b9d2f5;font-style:normal}.main{padding:32px clamp(20px,4vw,58px);max-width:1400px;width:100%;margin:auto}.kicker{text-transform:uppercase;color:var(--accent);font-weight:750;letter-spacing:.12em;font-size:11px}h1{font-size:30px;letter-spacing:-.025em;margin:6px 0 10px;line-height:1.28}h2{font-size:21px;margin:0 0 12px}h3{margin:0 0 9px;font-size:16px}.muted{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:23px;margin:17px 0;box-shadow:0 3px 12px #21395808}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#e5ebf4;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:var(--accent);width:0;transition:.2s}.pill{display:inline-flex;align-items:center;font-size:12px;background:var(--accent2);color:var(--accent);padding:4px 10px;border-radius:18px;font-weight:650}.week-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:16px}.week{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;cursor:pointer;text-align:left;color:var(--ink)}.week:hover{border-color:var(--accent);box-shadow:0 3px 12px #244b8720}.week.complete{border-color:#79baa1}.week .num{font-size:11px;font-weight:750;color:var(--accent)}.week .name{font-weight:700;margin:4px 0}.week .desc{font-size:12px;color:var(--muted)}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #bfd0e8;border-radius:9px;background:#fff;color:var(--accent);font-weight:650;padding:9px 15px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:#a83c3c;border-color:#e8caca}.btn:hover{filter:brightness(.97)}.assignment{display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line);padding:12px 0}.assignment input{margin-top:6px;accent-color:var(--accent);width:17px;height:17px}.lesson-section{margin:25px 0;border-top:1px solid var(--line);padding-top:20px}.lesson-section:first-child{margin-top:0;border:0;padding-top:0}.lesson-section h2{font-size:20px}.example,.callout{border-left:4px solid #628cd1;background:#f0f5fd;padding:14px 17px;border-radius:0 9px 9px 0;margin:17px 0}.diagram{overflow:auto;background:#f9fbff;border-radius:12px;border:1px solid var(--line);padding:15px;margin:13px 0}.diagram svg{display:block;max-width:100%;height:auto;margin:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);text-align:left;padding:10px 8px;vertical-align:top}th{background:#f4f7fb}textarea{width:100%;min-height:150px;resize:vertical;border:1px solid #cbd6e4;border-radius:10px;padding:13px;background:#fff;color:var(--ink)}.question{padding:17px 0;border-bottom:1px const weeks=[["Client–Server & System Architecture", "Client、Server、API、Database、Cache、Load Balancer", "畫出企業通訊服務的基本架構"], ["Networking Fundamentals", "TCP/IP、DNS、HTTP/HTTPS、TLS、WebSocket", "追蹤一次登入與傳訊的網路流程"], ["Communication & Performance", "同步/非同步、Reverse Proxy、Latency、Bandwidth", "比較訊息推送的技術選項"], ["System Design Review", "架構圖、故障情境、Non-functional Requirements", "完成 Chat Platform 架構評估"], ["REST API Fundamentals", "HTTP Methods、JSON、Status Codes、Authentication", "使用 Postman 呼叫練習 API"], ["API Contracts", "OpenAPI、Versioning、Pagination、Rate Limit", "撰寫 Service Node Management API"], ["Database & Scripting", "SQL、Index、Transaction、基本 Python", "建立資料表並撰寫查詢"], ["API Design Review", "Idempotency、Error Handling、Backward Compatibility", "提交 API Spec 與測試案例"], ["Scaling Systems", "Vertical / Horizontal Scaling、Load Balancing、State", "評估 1,000 名使用者的擴展方案"], ["Data Consistency", "Replication、Consistency、CAP、Partition", "分析多節點資料一致性風險"], ["Concurrency & Resilience", "Queue、Retry、Timeout、Idempotency", "設計重試與失敗恢復流程"], ["High Availability", "Active–Passive、Active–Active、Failover", "完成 HA 提案與 Failure Matrix"], ["Docker Essentials", "Linux、Image、Container、Volume", "容器化練習服務"], ["Multi-service Deployment", "Docker Compose、Service Networking、DB", "部署 API 與資料庫"], ["Kubernetes Fundamentals", "Pod、Service、Deployment、Scaling", "建立基本 K8s 部署圖"], ["Release Engineering", "CI/CD、Canary、Rolling Update、Rollback", "設計部署及回滾方案"], ["Service Objectives", "SLI、SLO、SLA、Error Budget", "定義服務可用性指標"], ["Observability", "Logs、Metrics、Traces、Alerts", "設計監控與告警規格"], ["Continuity & Recovery", "RTO、RPO、Backup、Disaster Recovery", "完成災難復原計畫"], ["Security Architecture", "OAuth、OIDC、RBAC、mTLS、Zero Trust", "進行簡易 Threat Modeling"], ["Platform Case Study", "問題定義、架構選擇、成本與風險", "完成 API / Platform Case"], ["Reliability Case Study", "HA、Migration、Recovery、Metrics", "完成 Reliability Case"], ["Security Case Study", "Access Control、Audit、Compliance、Trade-off", "完成 Security Case"], ["Interview & Portfolio", "Technical Deep Dive、英文說明、決策溝通", "完成三份案例與模擬面試"]];const phases=["System Design & Networking", "API Design & Databases", "Distributed Systems", "Cloud & DevOps", "Reliability & Security Architecture", "Technical PM Portfolio"];const resources=[["Microsoft Azure Architecture Patterns", "https://learn.microsoft.com/en-us/azure/architecture/patterns"], ["MDN HTTP overview", "https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview"], ["Cloudflare Learning Center: DNS", "https://www.cloudflare.com/learning/dns/what-is-dns/"], ["OpenAPI Specification", "https://spec.openapis.org/oas/latest.html"], ["Docker Getting Started", "https://docs.docker.com/get-started/"], ["Google SRE Workbook", "https://sre.google/workbook/table-of-contents/"], ["AWS Reliability Pillar", "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html"]];const lesson="<section class=\"lesson-section\"><h2>1. Client–Server 是什麼？</h2><p><b>Client（客戶端）</b> 是使用者操作的應用程式，<b>Server（伺服器）</b> 提供資料與業務功能。客戶端透過 <b>Request（請求）</b> 向伺服器提出需求，伺服器處理後回傳 <b>Response（回應）</b>。</p><div class=\"example\"><b>Synology 類似情境（概念示例，非內部實際架構）</b><p>使用者在企業通訊 App 輸入文字，Client 呼叫發送訊息 API，Server 驗證身分及頻道權限，並將訊息交給持久化流程。成功後回應 Client，再透過即時連線或推播機制通知接收者。</p></div><p><b>PM 思考：</b>按下「傳送」後，何時可以顯示成功？是 Server 接收請求後，還是資料已安全寫入後？這會影響使用者信任與失敗重試行為。</p></section><section class=\"lesson-section\"><h2>2. 系統元件各負責什麼？</h2><table><thead><tr><th>元件</th><th>基本職責</th><th>PM 該問什麼</th></tr></thead><tbody><tr><td>Client</td><td>顯示 UI、處理輸入與狀態</td><td>斷線時顯示什麼？能否重試？</td></tr><tr><td>API / Backend</td><td>驗證、授權與業務邏輯</td><td>錯誤碼是否清楚？如何限制濫用？</td></tr><tr><td>Database</td><td>永久保存資料</td><td>何時算寫入成功？如何備份？</td></tr><tr><td>Cache</td><td>加速讀取短期資料</td><td>資料過期會造成什麼問題？</td></tr><tr><td>Load Balancer</td><td>分配流量至多個實例</td><td>節點失效時如何導流？</td></tr></tbody></table><p><b>注意：</b>Load Balancer 並不能自動解決所有擴展問題。若 Server 依賴本機 Session 或單一 Database，仍可能形成瓶頸。</p></section><section class=\"lesson-section\"><h2>3. 一次訊息發送的完整流程</h2><ol><li>Client 檢查輸入，發出 HTTPS Request。</li><li>Server 驗證身分（Authentication）與是否有發文權限（Authorization）。</li><li>Server 執行業務邏輯，將訊息保存至 Database（或交給具可靠保證的持久化流程）。</li><li>Server 回傳成功或明確錯誤。Client 更新訊息狀態。</li><li>系統通知其他在線 Client；離線用戶可透過之後同步或推送機制收到更新。</li></ol><div class=\"callout\">不同系統可能有不同順序與一致性保證；這裡是學習用參考設計，不代表 ChatPlus 的實作。</div></section><section class=\"lesson-section\"><h2>4. Architecture Trade-off：同步還是非同步？</h2><p><b>同步（Synchronous）</b>：Caller 等待結果，較直覺，但可能增加延遲。<b>非同步（Asynchronous）</b>：先接受工作，之後再處理，可減少等待與隔離部分故障，但必須處理訊息狀態、重試和重複執行。</p><p><b>範例：</b>訊息是否儲存成功通常影響使用者是否看到「已送出」；但對離線收件者的 Push Notification，可以視需求非同步處理。</p><p><b>Technical PM 討論題：</b>若 Push Provider 暫時不可用，是否要讓發訊 API 失敗？為什麼？</p></section><section class=\"lesson-section\"><h2>5. Non-functional Requirements（非功能性需求）</h2><p>除了「可以傳送訊息」，還要定義品質要求，例如 <b>Availability（可用性）</b>、<b>Latency（延遲）</b>、<b>Scalability（擴展能力）</b>、<b>Security（安全性）</b> 和 <b>Recoverability（可復原性）</b>。</p><p>好的 NFR 要明確指定量測範圍，例如：「在指定測試負載與網路條件下，發送 API 的 p95 回應時間小於某目標」，而不只是「速度要快」。目標值應由實際需求與測量決定。</p></section>";const quiz=[{"q": "使用者傳送訊息後，Server 驗證該使用者是否有頻道發文權限。這主要是哪一個概念？", "a": ["Authentication（身分驗證）", "Authorization（授權）", "Caching（快取）", "Load Balancing（負載平衡）"], "correct": 1, "why": "Authorization 判斷已識別的使用者能否執行某項操作；Authentication 是確認其身分。"}, {"q": "若通知服務暫時故障，但訊息已安全保存，以下哪種設計較能避免不必要地讓發送訊息失敗？", "a": ["要求 Client 永遠等待通知服務恢復", "將推播通知與訊息儲存拆開，並設計可靠的非同步重試", "把所有資料只存在 Client 記憶體", "讓 Load Balancer 直接取代 Database"], "correct": 1, "why": "非同步處理可隔離通知服務故障，但要設計 Queue、Retry 與去重等可靠機制。"}, {"q": "增加 Load Balancer 後，以下哪一項仍可能是系統的單點瓶頸？", "a": ["Database 只有一台且沒有備援", "所有 Client 均可使用 HTTPS", "有定義 API 文件", "UI 支援深色模式"], "correct": 0, "why": "負載平衡只能分配前端服務流量；沒有備援的單一資料庫仍可能造成服務中斷。"}, {"q": "「系統應該很快」作為 Non-functional Requirement 的最大問題是什麼？", "a": ["它涉及 Client，因此不適用", "它沒有定義可觀測的指標與條件", "它只能用於 Mobile", "它一定比 p95 好"], "correct": 1, "why": "可驗證的 NFR 應說明指標、測量範圍、負載與期望門檻。"}, {"q": "下列哪一項最接近 Client–Server 的基本互動？", "a": ["Server 必須直接顯示所有使用者畫面", "Client 發出 Request，Server 處理並回傳 Response", "Database 主動替每個 Client 產生 UI", "Client 不需要任何網路即可完成所有遠端操作"], "correct": 1, "why": "Client–Server 模式的核心是透過協定交換請求與回應；即時事件也可能另有 Server Push。"}];
const lessonW2="<section class=\"lesson-section\"><h2>1. Networking Mental Model：從 App 到 Server</h2><p>網路並不是「App 直接找到 Server」。Client 需要先定位服務、建立傳輸連線、協商安全性，再交換應用層訊息。</p><table><tr><th>術語</th><th>定位</th><th>PM 重點</th></tr><tr><td>IP Address</td><td>網路上的位址</td><td>內外網、IP 變動與防火牆</td></tr><tr><td>TCP</td><td>可靠且有序的位元組串流</td><td>連線建立、重傳、壅塞、延遲</td></tr><tr><td>UDP</td><td>無連線資料報</td><td>低延遲媒體傳輸，可靠性由應用或上層機制處理</td></tr><tr><td>DNS</td><td>網域名稱解析</td><td>使用者能否找到正確的服務端點</td></tr><tr><td>TLS</td><td>加密與驗證連線</td><td>憑證、信任、失效與安全連線</td></tr><tr><td>HTTP(S)</td><td>應用層請求／回應</td><td>登入、設定、訊息 API</td></tr><tr><td>WebSocket</td><td>在單一連線上進行雙向訊息傳遞</td><td>即時通知、重連與狀態同步</td></tr></table><div class=\"callout\"><b>技術精確性：</b>典型 HTTPS 可以是 HTTP/1.1 或 HTTP/2 over TCP+TLS；HTTP/3 則通常使用 QUIC over UDP，並內建 TLS 1.3 安全機制。不要把「HTTP 一律使用 TCP」當成普遍規則。</div></section><section class=\"lesson-section\"><h2>2. DNS：Client 如何找到服務？</h2><ol><li>使用者開啟 <code>https://chat.example.com</code>。</li><li>瀏覽器或作業系統查詢 DNS 快取；必要時向 Resolver 查詢。</li><li>Resolver 取得 A/AAAA 或 CNAME 等記錄，找到目的端位址。</li><li>Client 選擇端點並建立連線；服務仍可能經由 Reverse Proxy、Load Balancer 才抵達 Backend。</li></ol><p><b>DNS TTL（Time to Live）</b>影響快取多久。當服務搬遷或 Failover 時，調整 DNS 並不代表所有使用者立即切換；既有連線、Resolver 快取與客戶端行為也會影響。</p><div class=\"example\"><b>Synology 類似情境（示意）</b><p>一家企業把 on-prem 通訊服務由舊入口轉到新域名。部分使用者仍連線舊站點。PM 需要分辨 DNS 快取、憑證網域不相符、反向代理設定或 Client 寫死網址等不同根因。</p></div></section><section class=\"lesson-section\"><h2>3. TCP、UDP 與連線品質</h2><p><b>TCP</b>提供可靠、有序的資料傳遞，但丟包後的重傳可能增加延遲。<b>UDP</b>不內建相同的可靠與排序保證，常供即時媒體或 QUIC 作為底層傳輸。選擇協定須考量應用特性，而非單純比較「誰比較快」。</p><p>常見延遲指標：<b>RTT</b>（Round-trip Time，往返時間）、<b>Jitter</b>（延遲變動）、<b>Packet Loss</b>（封包遺失），以及 <b>Bandwidth</b>（可用頻寬）。高 Bandwidth 不代表低 Latency。</p><p><b>PM 判斷：</b>Chat 文字訊息、檔案上傳、Meet 視訊通話對丟包與延遲的容忍度不同，應分別定義 SLO 或測試條件。</p></section><section class=\"lesson-section\"><h2>4. HTTPS / TLS：安全連線發生在哪一步？</h2><ol><li>解析 DNS，取得連線端點。</li><li>建立傳輸連線（例如 TCP；HTTP/3 為 QUIC）。</li><li>進行 TLS 交握，驗證伺服器憑證與網域名稱，協商安全參數。</li><li>在安全連線上發送 HTTP Request，接收 Response。</li></ol><p>常見 TLS 故障：憑證過期、憑證主機名稱不符、憑證鏈不受信任、設備時間偏差。<b>HTTPS 加密傳輸不等於使用者已登入，也不等於授權正確。</b></p><div class=\"example\"><b>情境題</b><p>Meet Client 出現「無法建立安全連線」。不要直接歸因為 Server Down。應先切分 DNS、網路可達性、憑證信任、TLS Negotiation 與後端 API 問題。</p></div></section><section class=\"lesson-section\"><h2>5. HTTP vs WebSocket：即時通訊如何設計？</h2><p><b>HTTP</b>以請求／回應為核心，適合登入、歷史訊息查詢、更新設定。<b>WebSocket</b>則提供持續雙向通訊，適合新訊息推送、線上狀態、即時事件。但 WebSocket 也要設計身分驗證、心跳、斷線重連、事件去重與缺漏補齊。</p><p><b>重要取捨：</b>WebSocket 連線存在不代表每則訊息必定送達。若斷線期間遺失事件，Client 應以游標或序號重新同步，而不是只依賴通知。</p></section><section class=\"lesson-section\"><h2>6. PM 故障定位：把問題拆成層次</h2><table><tr><th>觀察到的症狀</th><th>優先確認</th><th>可量測證據</th></tr><tr><td>無法開啟網站</td><td>DNS / 連線 / TLS / HTTP</td><td>nslookup、curl、錯誤碼</td></tr><tr><td>登入成功但訊息延遲</td><td>API 延遲、即時連線、DB 或 Queue</td><td>API p95、WebSocket 重連率</td></tr><tr><td>只有外部網路無法連線</td><td>Firewall、NAT、Reverse Proxy、TURN 等</td><td>內外網分別測試、連線紀錄</td></tr><tr><td>視訊卡頓但文字正常</td><td>RTT、Jitter、Packet Loss、Media Path</td><td>媒體品質統計</td></tr></table><p><b>PM 核心能力：</b>提出可驗證的假說，避免把「網路不好」當成不可操作的問題描述。</p></section>";const quizW2=[{"q":"使用者輸入 https://chat.example.com，瀏覽器通常需要哪項服務將網域名稱解析成可連線的位址？","a":["DNS","TLS","WebSocket","HTTP Status Code"],"correct":0,"why":"DNS 負責名稱解析；TLS 負責安全連線，WebSocket 用於雙向訊息，HTTP Status Code 是回應狀態。"},{"q":"關於 HTTP 與傳輸協定，下列何者正確？","a":["所有 HTTP 都必須使用 TCP","HTTP/3 通常透過 QUIC over UDP","UDP 會保證所有封包依序到達","HTTPS 不需要驗證伺服器身分"],"correct":1,"why":"HTTP/3 通常建構於 QUIC/UDP；HTTP/1.1、HTTP/2 常使用 TCP。UDP 不自行提供可靠、有序傳遞。"},{"q":"使用者在企業網路中遇到 HTTPS 憑證主機名稱不相符。最直接應檢查什麼？","a":["是否已清空所有聊天訊息","憑證 SAN 與連線網域是否匹配","WebSocket 訊息排序是否錯誤","資料庫是否已啟用索引"],"correct":1,"why":"TLS 驗證包含檢查憑證代表的主機名稱是否與連線網域匹配。"},{"q":"Chat Client 已重新連上 WebSocket，如何避免漏掉斷線期間的訊息？","a":["只顯示『已連線』就視為完成","使用上次接收的序號／游標同步缺漏事件","關閉所有 API 錯誤回應","讓 DNS TTL 永遠為零"],"correct":1,"why":"重連並不代表事件完整；需透過游標或序號、歷史資料或事件同步 API 補齊缺漏。"},{"q":"Meet 視訊卡頓，但文字聊天正常；哪組資訊最適合協助定位媒體傳輸品質？","a":["CPU 名稱與螢幕尺寸","RTT、Jitter、Packet Loss","DNS TTL 與網域註冊費","資料庫欄位名稱"],"correct":1,"why":"即時媒體對網路往返時間、延遲變動與遺失率敏感；文字聊天正常無法排除媒體路徑問題。"}];
const lessonW3="\n<section class=\"lesson-section\"><h2>1. Communication Model：同步與非同步</h2>\n<p><b>同步（Synchronous）</b>指呼叫端必須等待某個操作的回應才能繼續處理當前流程；<b>非同步（Asynchronous）</b>允許先接受工作，完成後再通知或由 Client 查詢。同步不等於 HTTP、非同步也不等於 WebSocket；它們分屬不同設計層次。</p>\n<table><tr><th>模式</th><th>示例</th><th>取捨</th></tr><tr><td>同步 Request–Response</td><td>確認使用者是否有權限加入 Channel</td><td>立即得到結果，卻易受下游延遲影響</td></tr><tr><td>非同步 Job / Queue</td><td>大量訊息的搜尋索引建立</td><td>降低前台等待，但需要追蹤狀態、重試、去重</td></tr><tr><td>Event-driven</td><td>訊息已持久化後發送通知事件</td><td>服務解耦，但需處理事件順序與重送</td></tr></table>\n<div class=\"example\"><b>Synology 類似情境（架構示意，非內部實作）</b><p>使用者發送訊息：API 先驗證權限並寫入主要資料庫，再回覆「已接受」。通知與全文索引可經由 Event / Queue 後續執行。PM 要清楚定義「傳送成功」究竟是 Server 接收、資料已持久化，還是對方已收到。</p></div>\n</section>\n<section class=\"lesson-section\"><h2>2. Reverse Proxy & Load Balancer：入口層如何工作</h2>\n<p><b>Reverse Proxy（反向代理）</b>是站在 Server 前方，代表後端接收與轉送 Client 請求的服務。常見用途有 TLS Termination、Route、Authentication Gateway、Rate Limiting。<b>Load Balancer（負載平衡器）</b>則將工作分配給多個健康的服務實例；兩者功能經常重疊，但概念不完全相同。</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 660 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Client requests go to reverse proxy which routes to API services and WebSocket service\"><defs><marker id=\"w3arrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"><path d=\"M0 0L7 3.5L0 7\" fill=\"none\" stroke=\"#52759f\" stroke-width=\"1.6\"/></marker></defs><g font-family=\"system-ui\" text-anchor=\"middle\" font-size=\"14\" fill=\"#173c6b\"><rect x=\"8\" y=\"75\" width=\"110\" height=\"60\" rx=\"9\" fill=\"#deebfd\" stroke=\"#9bb4d9\"/><text x=\"63\" y=\"110\">Client</text><rect x=\"177\" y=\"75\" width=\"168\" height=\"60\" rx=\"9\" fill=\"#e4edfa\" stroke=\"#9bb4d9\"/><text x=\"261\" y=\"101\">Reverse Proxy</text><text x=\"261\" y=\"119\">/ Load Balancer</text><rect x=\"431\" y=\"9\" width=\"198\" height=\"47\" rx=\"8\" fill=\"#ddf0e7\" stroke=\"#8cbaa6\"/><text x=\"530\" y=\"37\">API Service A</text><rect x=\"431\" y=\"86\" width=\"198\" height=\"47\" rx=\"8\" fill=\"#ddf0e7\" stroke=\"#8cbaa6\"/><text x=\"530\" y=\"114\">API Service B</text><rect x=\"431\" y=\"163\" width=\"198\" height=\"47\" rx=\"8\" fill=\"#f5e8cf\" stroke=\"#c7b185\"/><text x=\"530\" y=\"191\">Realtime Service</text></g><g stroke=\"#52759f\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#w3arrow)\"><path d=\"M118 105H177\"/><path d=\"M345 105H382V32H431\"/><path d=\"M345 105H431\"/><path d=\"M345 105H382V187H431\"/></g></svg></div>\n<p>區分 <b>L4</b>（主要依 IP、Port、Transport）、<b>L7</b>（可依 Host、Path、HTTP Header 轉送）。若服務維持 WebSocket 長連線，需要考慮 Proxy 的 Idle Timeout、Connection Draining、Keepalive 與部署時的斷線重連。</p>\n<div class=\"callout\"><b>關鍵陷阱：</b>導入 Load Balancer 並不等於所有服務自動 High Availability；資料庫、Session Storage、身份驗證與單一入口都可能成為 Single Point of Failure。</div>\n</section>\n<section class=\"lesson-section\"><h2>3. Latency、Throughput 與 Bandwidth</h2>\n<p><b>Latency（延遲）</b>是單次操作或請求花費的時間；<b>Throughput（吞吐量）</b>是單位時間完成的工作量（如 requests/sec）；<b>Bandwidth（頻寬）</b>描述通道在單位時間能傳輸的資料量，通常以 bit/s 表示。三者不能混用。</p>\n<table><tr><th>指標</th><th>定義／單位</th><th>PM 驗收例子（假設值）</th></tr><tr><td>p50 / p95 / p99 Latency</td><td>延遲分位數，ms</td><td>在 100 RPS 下，傳訊 API 的 p95 &lt; 500ms</td></tr><tr><td>Throughput</td><td>每秒成功處理工作數，RPS</td><td>維持 100 RPS 並符合錯誤率限制</td></tr><tr><td>Bandwidth</td><td>Mbps / Gbps</td><td>錄影與檔案傳輸是否壓滿 WAN</td></tr><tr><td>Concurrency</td><td>同一時間進行中的請求或連線數</td><td>1000 個在線 WebSocket 並非 1000 RPS</td></tr></table>\n<p><b>Little’s Law</b>：在穩態、同一系統邊界及一致的時間單位下，平均系統內工作數 L = 到達率 λ × 平均停留時間 W。例：100 requests/s × 0.2s ≈ 20 個同時處理或等待的請求。這是平均量，不是容量上限或 p95 延遲保證。</p>\n</section>\n<section class=\"lesson-section\"><h2>4. Performance Bottleneck：慢在哪一層？</h2>\n<p>一次訊息操作可能包含 DNS / TLS、Proxy、API Processing、DB Write、Queue Publish 與通知投遞。不能只依畫面延遲判斷是哪一層造成瓶頸。觀察資料應至少包含 <b>Client-side Timing、Server-side Latency、Database Query Duration、Queue Lag、Error Rate</b>。</p>\n<div class=\"example\"><b>情境：訊息從按送出到畫面顯示耗時 1.2 秒</b><p>假設分解為 Network 100ms、Proxy 20ms、API 80ms、DB 900ms、其餘 100ms，則資料庫是優先分析點。若只增加 Frontend Server 並不一定改善端到端延遲。這些數字僅為教學示例，應透過 Tracing 實際量測。</p></div>\n<p><b>Tail Latency</b> 是關鍵：平均值好看不代表使用者體驗好。若 p95 為 800ms，代表在該測量集合中約 95% 的請求延遲不超過 800ms，仍有約 5% 更慢；定義範圍與測量期間不可省略。</p>\n</section>\n<section class=\"lesson-section\"><h2>5. Realtime Delivery：Polling、SSE、WebSocket、Push</h2>\n<table><tr><th>方案</th><th>優點</th><th>限制／適用性</th></tr><tr><td>Polling</td><td>簡單、與一般 HTTP 架構相容</td><td>更新頻率與請求負載取捨</td></tr><tr><td>Server-Sent Events (SSE)</td><td>Server → Client 單向事件串流</td><td>Client → Server 仍通常另用 HTTP</td></tr><tr><td>WebSocket</td><td>持續雙向連線、互動效率高</td><td>需管理長連線、心跳、重連、事件同步</td></tr><tr><td>Mobile Push</td><td>背景或 App 未開啟時可提示</td><td>不應視為可靠訊息儲存／唯一傳送機制</td></tr></table>\n<p>技術選型先問：是否需要雙向低延遲？使用者在線比例？背景通知要求？連線規模與防火牆限制？訊息順序與確認語意？任何方案都要另外設計 <b>Delivery Acknowledgment</b> 與重連後的 <b>Catch-up / Resync</b>。</p>\n</section>\n<section class=\"lesson-section\"><h2>6. Technical PM Design Review：把架構變成決策</h2>\n<p>提出方案時，寫下：<b>Problem</b>（使用者痛點）、<b>Requirements</b>（即時性／可靠性／安全）、<b>Options</b>（Polling / SSE / WebSocket）、<b>Trade-offs</b>（Infra Cost、Complexity、Failure Recovery）、<b>Metrics</b>（p95、Delivery Success、Reconnect Rate）。</p>\n<div class=\"callout\"><b>本週必會：</b>能說明同步與非同步的差別、Reverse Proxy 與 Load Balancer 的角色、Latency 和 Throughput 的區別，並提出測量證據後才做架構決策。</div>\n</section>";const quizW3=[{"q": "Chat Service 在資料庫成功寫入訊息後，將通知工作送入 Queue。這個架構最重要的取捨是什麼？", "a": ["通知處理可與 API 解耦，但須設計重試和去重", "所有訊息必然即時抵達接收者", "Queue 可取代資料庫持久化", "前台 API 不再需要身份驗證"], "correct": 0, "why": "非同步事件有助於解耦與縮短前台等待，但必須處理 Delivery、Retry、Idempotency 與失敗監控。"}, {"q": "哪個敘述最準確地區分 Reverse Proxy 與 Load Balancer？", "a": ["Reverse Proxy 只能用於資料庫", "Load Balancer 一律會加密所有資料", "Reverse Proxy 代理後端處理請求；Load Balancer 重點是分配工作，兩者功能可重疊", "兩者皆保證資料庫自動備援"], "correct": 2, "why": "反向代理與負載平衡是角色／能力概念，產品實作可能同時具有兩者功能。"}, {"q": "1000 位使用者維持 WebSocket 連線，但每秒只送出 30 個 API Request。下列何者正確？", "a": ["Concurrency 和 RPS 一定相等", "在線連線數不等於每秒請求量", "1000 條連線等於 1000 Mbps", "所有連線都一定每秒送出一則訊息"], "correct": 1, "why": "同時連線量與每秒請求／訊息處理量是不同維度；容量規劃需要一起量測。"}, {"q": "在穩態系統中，每秒平均有 50 個 Request 進入，平均停留時間為 0.4 秒。依 Little’s Law，平均系統中約有多少 Request？", "a": ["12.5", "20", "50", "125"], "correct": 1, "why": "L = λ × W = 50 requests/s × 0.4s = 20 requests。這不是高峰容量或 p95 的直接推估。"}, {"q": "若訊息 API 的 p95 延遲變差，PM 最適合先要求哪些資訊？", "a": ["只看整體平均延遲", "直接再增加一台 Load Balancer", "按 Client、Proxy、API、DB、Queue 分層的延遲與 Error 指標", "直接改用 UDP 傳送所有訊息"], "correct": 2, "why": "透過分層 Timing、Tracing、Error 和 Queue 指標才能判斷瓶頸，避免在錯誤的層擴容。"}];
const lessonW4="\n<section class=\"lesson-section\"><h2>1. System Design Review：從需求到架構決策</h2>\n<p><b>System Design Review（系統架構審查）</b>的目的不是選出「最先進」的技術，而是在已知限制下，判斷某個架構是否能可靠地達成產品需求。Technical PM 需要先將 <b>Functional Requirements（功能需求）</b> 和 <b>Non-functional Requirements（非功能需求，NFR）</b> 分開。</p>\n<table><tr><th>類別</th><th>Chat 平台範例（假設）</th><th>驗證問題</th></tr>\n<tr><td>Functional</td><td>登入、傳送訊息、歷史同步、即時推送</td><td>用戶能完成哪些操作？</td></tr>\n<tr><td>Availability</td><td>核心傳訊服務月度可用性 99.9%</td><td>分母、監控點、排除條件如何定義？</td></tr>\n<tr><td>Performance</td><td>在指定負載下，傳訊 API p95 &lt; 500ms</td><td>從 Client 或 Server 計時？測試負載是什麼？</td></tr>\n<tr><td>Scale</td><td>1,000 active users、200 concurrent sends（測試假設）</td><td>活躍使用者、連線數、RPS 是否分別量測？</td></tr>\n<tr><td>Security</td><td>Channel Authorization、TLS、Audit Trail</td><td>未授權請求如何拒絕與記錄？</td></tr>\n<tr><td>Recoverability</td><td>備份、復原流程、明確的 RTO/RPO 目標</td><td>失敗時能否還原？目標有經過演練嗎？</td></tr></table>\n<div class=\"callout\"><b>PM 判斷：</b>「支援 1,000 人」不是完整規格。必須寫明並發連線、訊息吞吐量、檔案大小、網路條件、硬體規格，以及成功與失敗的驗收方式。</div>\n</section>\n<section class=\"lesson-section\"><h2>2. 畫出 Architecture Diagram 與 Data Flow</h2>\n<p>至少辨識 <b>Client、DNS/TLS Endpoint、Reverse Proxy、API、Authentication/Authorization、Database、Event Queue、Realtime Gateway</b>。畫資料流時應標示同步／非同步及信任邊界（Trust Boundary）。</p>\n<div class=\"diagram\"><svg viewBox=\"0 0 750 345\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Illustrative chat architecture with client, proxy, auth, API, database, queue and realtime gateway\"><defs><marker id=\"w4arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8\" fill=\"none\" stroke=\"#496b95\" stroke-width=\"1.5\"/></marker></defs><g font-family=\"system-ui\" font-size=\"14\" fill=\"#173c6b\" text-anchor=\"middle\"><rect x=\"18\" y=\"111\" width=\"105\" height=\"61\" rx=\"9\" fill=\"#e5effc\" stroke=\"#96b4d9\"/><text x=\"70\" y=\"139\">Client</text><text x=\"70\" y=\"157\" font-size=\"11\">Web / Mobile</text><rect x=\"172\" y=\"111\" width=\"113\" height=\"61\" rx=\"9\" fill=\"#e5effc\" stroke=\"#96b4d9\"/><text x=\"229\" y=\"136\">Proxy /</text><text x=\"229\" y=\"155\">TLS Gateway</text><rect x=\"336\" y=\"111\" width=\"110\" height=\"61\" rx=\"9\" fill=\"#e5effc\" stroke=\"#96b4d9\"/><text x=\"391\" y=\"138\">API</text><text x=\"391\" y=\"157\" font-size=\"11\">AuthZ / Logic</text><rect x=\"508\" y=\"27\" width=\"158\" height=\"55\" rx=\"9\" fill=\"#ddf0e7\" stroke=\"#92bba7\"/><text x=\"587\" y=\"52\">Database</text><text x=\"587\" y=\"70\" font-size=\"11\">Persistent messages</text><rect x=\"508\" y=\"121\" width=\"158\" height=\"51\" rx=\"9\" fill=\"#faebd4\" stroke=\"#d0b58d\"/><text x=\"587\" y=\"149\">Event Queue</text><rect x=\"508\" y=\"226\" width=\"158\" height=\"57\" rx=\"9\" fill=\"#ddf0e7\" stroke=\"#92bba7\"/><text x=\"587\" y=\"250\">Realtime</text><text x=\"587\" y=\"269\">Gateway</text></g><g stroke=\"#496b95\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#w4arr)\"><path d=\"M123 141H172\"/><path d=\"M285 141H336\"/><path d=\"M446 128H471V54H508\"/><path d=\"M446 155H508\"/><path d=\"M587 172V226\"/><path d=\"M508 257H470V307H69V172\"/></g><g fill=\"#63758d\" font-family=\"system-ui\" font-size=\"11\"><text x=\"125\" y=\"125\">HTTPS</text><text x=\"452\" y=\"99\">Sync Write</text><text x=\"460\" y=\"185\">Event</text><text x=\"389\" y=\"298\">Async notification / resync</text></g><rect x=\"156\" y=\"10\" width=\"529\" height=\"306\" rx=\"15\" stroke=\"#94a4ba\" stroke-dasharray=\"6 5\" fill=\"none\"/><text x=\"168\" y=\"27\" font-family=\"system-ui\" font-size=\"11\" fill=\"#64748b\">Illustrative server-side trust boundary</text></svg></div>\n<p><b>Synology 類似情境：</b>可將 Controller / Service Node 理解為負責不同任務的服務角色；但此圖為通用企業 Chat 練習架構，<b>不是 Synology 產品內部實作的描述</b>。實際設計還須確認 Session State、DB Owner、Node Assignment 與網路邊界。</p>\n<p><b>設計檢查：</b>資料在哪一個操作點被視為已持久化？通知失敗會否導致 API 失敗？WebSocket 重連後如何補齊訊息？</p></section>\n<section class=\"lesson-section\"><h2>3. Sequence Diagram：成功路徑與失敗路徑</h2>\n<p>架構圖呈現元件，<b>Sequence Diagram（時序圖）</b>則說明事件順序。以下為簡化傳訊流程：</p>\n<ol><li>Client 透過 HTTPS 送出 <code>POST /messages</code>，包含唯一的 <b>client_message_id</b>。</li><li>API 驗證 Authentication、Channel Authorization 及 Payload。</li><li>Database 交易完成後，API 回傳持久化訊息 ID。</li><li>後續通知透過 Event / Queue 傳給 Realtime Gateway。</li><li>接收者離線或重連時，依 Server Cursor 執行 <b>Catch-up / Resync</b>。</li></ol>\n<div class=\"example\"><b>失敗情境 A：DB Write 失敗</b><p>Server 不應宣稱訊息已成功持久化。Client 應看到可辨識的失敗狀態；使用相同 idempotency key 重試可避免重複建立訊息，具體行為取決於 API Contract。</p></div>\n<div class=\"example\"><b>失敗情境 B：DB 成功但 Queue Publish 失敗</b><p>若採用「先 DB 再 Event」的流程，需處理兩步驟間的可靠性缺口；可評估 <b>Transactional Outbox</b>、重送與監控。不可假設單純加入 Queue 就能保證通知不遺失。</p></div>\n</section>\n<section class=\"lesson-section\"><h2>4. Failure Mode & NFR：把不確定變成驗收條件</h2>\n<table><tr><th>故障點</th><th>使用者症狀</th><th>驗證方式</th><th>可能設計</th></tr>\n<tr><td>DNS / TLS</td><td>完全連不上或顯示憑證錯誤</td><td>DNS 結果、憑證 SAN、連線日誌</td><td>DNS 配置與憑證生命週期監控</td></tr>\n<tr><td>Proxy / API</td><td>部分請求 502/503/504</td><td>健康檢查、狀態碼、p95/p99</td><td>多實例與負載平衡、回滾</td></tr>\n<tr><td>Database</td><td>傳訊失敗或處理緩慢</td><td>DB Query Duration、Connections、Disk I/O</td><td>索引優化、容量規劃、備份</td></tr>\n<tr><td>Queue / Realtime</td><td>訊息已送出但通知延遲</td><td>Queue Lag、Delivery Failure、Reconnect Metrics</td><td>重試、Dead-letter Queue、Resync</td></tr>\n<tr><td>Network Partition</td><td>部分節點互不可達</td><td>Heartbeat、跨節點連線、Trace</td><td>Timeout、Failover、避免 Split-brain</td></tr></table>\n<p><b>指標設計：</b>除了 p95 API Latency，還可量測 <b>Message Persistence Success Rate、End-to-End Delivery Latency、Queue Lag、Reconnect Success Rate、Error Rate</b>。每項指標需註明測量點、時間窗口及適用流量。</p>\n</section>\n<section class=\"lesson-section\"><h2>5. Architecture Decision Record (ADR) 與方案比較</h2>\n<p>架構審查需有可追溯的決策記錄。<b>ADR（Architecture Decision Record）</b>建議使用：Context → Decision Drivers → Options → Decision → Consequences → Validation。</p>\n<table><tr><th>選項</th><th>優勢</th><th>限制／風險</th></tr>\n<tr><td>A. 同步完成所有通知後才回應</td><td>操作結果易理解</td><td>高延遲、下游通知故障會拖累 API</td></tr>\n<tr><td>B. 先持久化，再使用 Queue 非同步通知</td><td>降低通知路徑對前台 API 的耦合</td><td>要處理延遲、重送、事件持久性及補同步</td></tr></table>\n<p><b>合理決策例：</b>若需求優先是訊息不遺失與傳送回應快速，通常可考慮 B，但需要補足可靠事件發布與 Resync。若沒有客戶 SLA、規模與實測成本，就不能斷言 B 在所有情境都更好。</p>\n</section>\n<section class=\"lesson-section\"><h2>6. W4 Review：PM 如何主持架構審查？</h2>\n<p>用 15–20 分鐘做一次模擬 Review：</p>\n<ol><li><b>Problem & Scope（2 分鐘）：</b>描述用戶痛點、部署型態與本次不涵蓋的範圍。</li><li><b>Architecture（4 分鐘）：</b>說明主要元件、同步／非同步資料流。</li><li><b>Quality Targets（4 分鐘）：</b>提出可量測的 Security、Availability、Performance 及 Recovery 條件。</li><li><b>Failure Modes（4 分鐘）：</b>選出最嚴重三個失效點、對應偵測指標與降級行為。</li><li><b>Trade-offs（4 分鐘）：</b>比較替代方案、成本、複雜度和後續驗證。</li></ol>\n<div class=\"callout\"><b>本週畢業條件：</b>交付一份「一頁架構圖＋一頁 NFR / Failure Matrix＋一頁 ADR」，用英文術語與中文解釋，並能回答：為什麼這個方案比替代方案更適合現在的產品約束？</div>\n</section>\n";const quizW4=[{"q": "企業 Chat 平台提出『可支援 1,000 人』，Technical PM 最需要先追問哪項資訊？", "a": ["產品是否使用深色模式", "1,000 人是註冊、活躍、同時在線或同時送訊，以及負載與驗收條件", "是否使用三種 UI 字體", "開發團隊目前的會議時數"], "correct": 1, "why": "Capacity 需求必須定義使用者行為與 workload，包括連線數、RPS、訊息大小、硬體條件與量測方式；只有人數不足以判斷架構是否達標。"}, {"q": "訊息已成功寫入 DB，但事件發布到 Queue 時失敗。哪個設計最能處理這個可靠性缺口？", "a": ["回傳錯誤後刪除所有訊息", "取消所有 Authentication 驗證", "使用 Transactional Outbox 並設計重送及監控", "只提高 Client 的畫面更新頻率"], "correct": 2, "why": "Transactional Outbox 可在與主要資料交易一致的存放流程中記錄待發布事件，再由背景工作可靠地發布與重試；還需要消費端去重。"}, {"q": "以下哪一項屬於可驗收的 Non-functional Requirement？", "a": ["聊天室支援表情符號", "管理員可以建立頻道", "在指定 100 RPS 工作負載下，Send API 的 p95 latency 小於 500ms", "使用者可修改顯示名稱"], "correct": 2, "why": "NFR 描述品質屬性與可驗收標準；此敘述包含測量對象、負載條件、百分位數與時間門檻。"}, {"q": "導入兩台 API Server 與 Load Balancer 之後，是否就能宣稱整個通訊服務 High Availability？", "a": ["可以，因為 API Server 已經兩台", "可以，只要 Load Balancer 有健康檢查", "不能，還須檢查資料庫、狀態儲存、入口及其他單點故障", "可以，只要使用 WebSocket"], "correct": 2, "why": "API 層多實例只處理部分故障情境；DB、DNS、LB、Session、Queue 及其他關鍵依賴仍可能形成單點故障。"}, {"q": "在 System Design Review 中，當兩個方案都能提供功能時，Technical PM 最應如何決策？", "a": ["優先採用最新的技術名詞", "依 Requirement、Constraints、可量測指標及 Trade-off 進行比較", "由單一 RD 個人偏好直接決定", "選擇元件數最多的架構"], "correct": 1, "why": "架構決策應可追溯到使用者與業務需求，並記錄限制、替代方案、風險和驗證方式，而非靠技術流行度。"}];
const KEY='technical_pm_hub_v1';let state={completed:{},notes:{},quiz:{},current:0};try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...old}}catch(e){}let view='dashboard';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('本機儲存失敗，請使用匯出備份。')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function completedCount(){return Object.values(state.completed).filter(Boolean).length}function navigate(v){view=v;for(const el of document.querySelectorAll('.main>section'))el.classList.toggle('hidden',el.id!==v);document.querySelectorAll('.navbtn[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===v));if(v==='dashboard')renderDashboard();if(v==='week')renderWeek();if(v==='resources')renderResources();if(v==='backup')renderBackup();window.scrollTo(0,0)}function openWeek(i){state.current=i;save();navigate('week')}
function renderSide(){document.getElementById('sideweeks').innerHTML=weeks.map((w,i)=>`<button class="navbtn ${state.current===i?'active':''}" onclick="openWeek(${i})"><span>W${i+1} · ${esc(w[0])}</span><em>${state.completed[i]?'✓':''}</em></button>`).join('')}
function renderDashboard(){const n=completedCount();document.getElementById('dashboard').innerHTML=`<div class="kicker">YOUR ROADMAP</div><h1>Technical PM 學習總覽</h1><p class="muted">目標：Enterprise Platform / Infrastructure Product Manager · 每週 6 小時 · 24 週</p><div class="stats"><div class="stat"><strong>${n}/24</strong><span>已完成週數</span></div><div class="stat"><strong>${Math.round(n/24*100)}%</strong><span>整體進度</span></div><div class="stat"><strong>${(24-n)*6}h</strong><span>預估剩餘學習時數</span></div></div><div class="card"><div class="controls" style="justify-content:space-between"><h3>整體進度</h3><span class="badge-count">${n} / 24</span></div><div class="bar"><div style="width:${n/24*100}%"></div></div><p class="muted">建議每週：2 小時觀念、3 小時實作、1 小時 PM 產出。所有課程的主題與交付成果已建立，W1–W4 提供完整教材及測驗，後續週次提供學習框架與自學任務。</p><button class="btn primary" onclick="openWeek(${state.current})">繼續 W${state.current+1} 課程 →</button></div>${phases.map((p,j)=>`<div class="phase"><h2>Phase ${j+1} · ${esc(p)}</h2><div class="week-grid">${weeks.slice(j*4,j*4+4).map((w,k)=>{const i=j*4+k;return `<button class="week ${state.completed[i]?'complete':''}" onclick="openWeek(${i})"><div class="num">W${i+1} ${state.completed[i]?'· 已完成':''}</div><div class="name">${esc(w[0])}</div><div class="desc">${esc(w[1])}</div></button>`}).join('')}</div></div>`).join('')}`;renderSide()}
function drawDiagram(){return `<div class="diagram"><svg viewBox="0 0 620 225" role="img" aria-label="Client sends an HTTPS request to API server, which accesses a database, then returns response"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4e709c" stroke-width="1.6"/></marker></defs><g font-family="system-ui" font-size="15" font-weight="600" text-anchor="middle"><rect x="12" y="75" width="145" height="75" rx="10" fill="#dfeafa" stroke="#8eaad0"/><text x="84" y="105" fill="#153d76">Client</text><text x="84" y="126" font-size="12" fill="#345b8b">Web / Mobile</text><rect x="238" y="75" width="145" height="75" rx="10" fill="#dce9fa" stroke="#8eaad0"/><text x="310" y="105" fill="#153d76">API Server</text><text x="310" y="126" font-size="12" fill="#345b8b">Auth / Logic</text><rect x="464" y="75" width="145" height="75" rx="10" fill="#dcefe7" stroke="#91bda7"/><text x="536" y="106" fill="#176349">Database</text><text x="536" y="126" font-size="12" fill="#398466">Persistent Data</text></g><g stroke="#4e709c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M158 94H235"/><path d="M238 135H160"/><path d="M385 95H461"/><path d="M462 132H386"/></g><g font-family="system-ui" fill="#536985" font-size="11" text-anchor="middle"><text x="198" y="85">Request</text><text x="198" y="157">Response</text><text x="424" y="84">Write/Read</text><text x="424" y="157">Result</text></g><text x="310" y="202" font-family="system-ui" font-size="12" fill="#64768e" text-anchor="middle">概念流程：實際服務可能另有 Queue、Cache、Load Balancer 與通知系統</text></svg></div>`}
function renderWeek(){const i=state.current,w=weeks[i],isW1=i===0,isW2=i===1,isW3=i===2,isW4=i===3;document.getElementById('week').innerHTML=`<div class="kicker">PHASE ${Math.floor(i/4)+1} · WEEK ${i+1}</div><h1>${esc(w[0])}</h1><p class="muted">${esc(w[1])}</p><div class="controls"><span class="pill">預計 6 小時</span><button class="btn" onclick="openWeek(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← 上週</button><button class="btn" onclick="openWeek(${Math.min(23,i+1)})" ${i===23?'disabled':''}>下週 →</button></div><div class="card"><h3>本週學習目標</h3><p>${esc(w[2])}</p><label class="assignment"><input type="checkbox" ${state.completed[i]?'checked':''} onchange="state.completed[${i}]=this.checked;save();renderSide()"><span><b>標記本週已完成</b><br><span class="muted">完成教材、實作與驗收後再勾選</span></span></label></div><div class="card"><h2>課程教材</h2>${isW1?drawDiagram()+lesson:isW2?lessonW2:isW3?lessonW3:isW4?lessonW4:`<div class="callout">此週已建立學習架構，但尚未編寫逐節完整課文。請依主題閱讀資源、完成任務與記錄技術決策。未完成的內容不會被標示為已授課。</div><h3>本週學習主題</h3><p>${esc(w[1])}</p><h3>參考學習步驟</h3><ol><li>用 2 小時理解核心概念並寫下關鍵英文術語。</li><li>用 3 小時進行小型實作、架構繪圖或技術情境分析。</li><li>用 1 小時寫一份 PM 決策筆記：問題、選項、限制、驗證方式。</li></ol>`}</div><div class="card"><h2>實作任務</h2><p><b>交付成果：</b>${esc(w[2])}</p>${isW4?`<p><b>任務 A：Architecture Diagram</b> 畫出 Client → DNS/TLS → Proxy → API/Auth → Database，以及 Queue → Realtime Gateway 的主要路徑，註明同步與非同步邊界。</p><p><b>任務 B：NFR Acceptance Matrix</b> 定義 3 個可量測的品質要求，至少包含 Capacity / p95 Latency / Message Persistence Success Rate；寫下假設測試負載、測量點、時間窗口及通過標準。</p><p><b>任務 C：Failure Matrix</b> 至少列出 DNS/TLS、API、DB、Queue、Node Network Partition 五個失效點；每列都要有 User Symptom、Detection、Recovery Owner。</p><p><b>任務 D：ADR</b> 比較「同步通知」與「持久化後 Queue 通知」，記錄 Context、Options、Decision、Trade-offs、Validation Plan。</p><p><b>任務 E：Mock Review</b> 用 15–20 分鐘口頭報告架構，回答「DB 成功但 Queue 失敗時，使用者看到什麼？」「重連如何補訊息？」「為何雙 API 不保證 HA？」</p><p><b>完成交付：</b>一頁 Architecture Diagram＋一頁 NFR/Failure Matrix＋一頁 ADR，全部採用通用假設資料，不包含公司未公開資訊。</p>`:isW3?`<p><b>操作任務 A：比較同步與非同步</b> 使用公開示例或自行畫圖，分別設計「訊息寫入後同步發送通知」與「寫入後透過 Queue 發送通知」兩種流程；記錄 API 回覆時機、Queue 故障及重送風險。</p><p><b>操作任務 B：網頁瀏覽器 DevTools</b> 開啟 Network → Timing，觀察至少三個 Request 的 Waiting (TTFB) 與 Download 時間；如無法觀察分段就註明限制，不將 TTFB 誤認為純 Server CPU 時間。</p><p><b>操作任務 C：量化估算</b> 假設 100 RPS、平均回應時間 200ms，估算平均系統內 Request 數，並寫出 Little’s Law 的前提。</p><p><b>設計交付：</b>比較 Polling / SSE / WebSocket 的訊息通知方案，定義 Delivery Success Rate、p95 End-to-end Latency、Reconnect Success Rate 及可觀察的測量方式。</p><p><b>PM 決策題：</b>企業 1000 名使用者抱怨通知延遲，請先列出三個可驗證假說，再決定是否增加 Server / Queue Worker / Database Capacity。</p>`:isW2?`<p><b>操作任務 A：DNS</b> 使用 <code>nslookup example.com</code>（或 <code>dig example.com</code>），記錄解析到的位址與查詢結果。</p><p><b>操作任務 B：HTTPS</b> 使用 <code>curl -I https://example.com</code>，確認 HTTPS 連線與 HTTP 回應狀態；遇到網路限制時記錄錯誤，不要停用憑證驗證。</p><p><b>操作任務 C：連線偵錯</b> 打開瀏覽器 DevTools → Network，觀察一次網站載入的 Request、Status、Timing；若有 WebSocket 可觀察其連線與 Frames。</p><p><b>設計交付：</b>畫出 DNS → TCP/QUIC → TLS → HTTP/WebSocket → Backend 的概念時序圖，標示各層常見失敗、使用者症狀與應蒐集的證據。</p><p><b>PM 決策題：</b>企業客戶回報「內網正常、外網無法登入或加入會議」，提出至少三個不同根因、測試方式與負責團隊。</p>`:isW1?`<p>請畫出 Client → API Server → Database 的流程，並補上 Authentication、Authorization、Push Notification 與失敗回應。對每個元件回答：故障時使用者會看到什麼？</p><p><b>PM 決策題：</b>假設 1,000 位使用者同時上線，團隊提出「只要加一台 Load Balancer 就能提高可用性」。你會問哪些問題來驗證這個主張？</p>`:''}<textarea id="notes" placeholder="在此記錄學習筆記、技術架構說明、PM Trade-off、未解問題…" oninput="state.notes[${i}]=this.value;save()">${esc(state.notes[i]||'')}</textarea><p class="muted" style="font-size:12px">筆記會自動保存在此瀏覽器；換裝置或清除瀏覽器資料前請先匯出備份。</p></div>${isW1?quizMarkup(0):isW2?quizMarkup(1):isW3?quizMarkup(2):isW4?quizMarkup(3):`<div class="card"><h2>自我驗收</h2><p>能否不查資料解釋本週所有技術名詞、畫出關鍵流程，並以 Technical PM 角度比較兩個設計方案？</p></div>`}`;renderSide()}
function quizMarkup(week=0){const qs=week===3?quizW4:week===2?quizW3:week===1?quizW2:quiz;const answers=week===3?(state.quizW4||{}):week===2?(state.quizW3||{}):week===1?(state.quizW2||{}):state.quiz;return `<div class="card"><h2>W${week+1} 小測驗</h2><p class="muted">5 題單選；提交後查看解析。答錯可修改答案再測。</p>${qs.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b>${q.a.map((a,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} onchange="setQuizAnswer(${week},${i},${j})">${esc(a)}</label>`).join('')}<div id="fb${i}"></div></div>`).join('')}<div class="controls" style="margin-top:17px"><button class="btn primary" onclick="gradeQuiz(${week})">提交測驗 / 查看解析</button><button class="btn" onclick="resetQuiz(${week})">重做測驗</button></div><div id="quizResult" style="margin-top:12px"></div></div>`}
function setQuizAnswer(week,i,j){if(week===3){state.quizW4=state.quizW4||{};state.quizW4[i]=j}else if(week===2){state.quizW3=state.quizW3||{};state.quizW3[i]=j}else if(week===1){state.quizW2=state.quizW2||{};state.quizW2[i]=j}else{state.quiz[i]=j}save()}
function gradeQuiz(week=0){const qs=week===3?quizW4:week===2?quizW3:week===1?quizW2:quiz;const answers=week===3?(state.quizW4||{}):week===2?(state.quizW3||{}):week===1?(state.quizW2||{}):state.quiz;let score=0,answered=0;qs.forEach((q,i)=>{const a=answers[i],ok=a===q.correct;if(a!==undefined){answered++;if(ok)score++}document.getElementById('fb'+i).innerHTML=`<div class="${ok?'feedback':'warn'}">${a===undefined?'尚未作答。':(ok?'回答正確。':'正確答案：'+esc(q.a[q.correct])+'。')} ${esc(q.why)}</div>`});document.getElementById('quizResult').innerHTML=`<strong>得分：${score} / ${qs.length}</strong>（已回答 ${answered} 題）`;save()}
function resetQuiz(week=0){if(week===3)state.quizW4={};else if(week===2)state.quizW3={};else if(week===1)state.quizW2={};else state.quiz={};save();renderWeek()}
function renderResources(){document.getElementById('resources').innerHTML=`<div class="kicker">REFERENCE LIBRARY</div><h1>技術學習資源</h1><p class="muted">優先使用官方文件與可實作的免費資料。</p><div class="card">${resources.map(r=>`<div class="resource"><a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer"><b>${esc(r[0])} ↗</b></a><div class="muted" style="font-size:12px">${esc(r[1])}</div></div>`).join('')}</div>`}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='technical-pm-learning-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}function importData(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.state||typeof data.state!=='object')throw new Error('格式不正確');const x=data.state;state={completed:x.completed||{},notes:x.notes||{},quiz:x.quiz||{},quizW2:x.quizW2||{},quizW3:x.quizW3||{},quizW4:x.quizW4||{},current:Math.max(0,Math.min(23,Number(x.current)||0))};save();alert('匯入成功');navigate('dashboard')}catch(e){alert('無法讀取備份：'+e.message)}};reader.readAsText(file)}function renderBackup(){document.getElementById('backup').innerHTML=`<div class="kicker">DATA MANAGEMENT</div><h1>備份你的學習紀錄</h1><div class="card"><h2>你的資料存在哪裡？</h2><p>學習網站是單一離線 HTML 檔案。進度、筆記、測驗答案使用瀏覽器 <b>localStorage</b> 儲存在目前的瀏覽器設定檔。網站沒有帳號、伺服器同步或雲端資料庫。</p><p class="warn">注意：更換瀏覽器、使用無痕模式、清理網站資料或開啟不同檔案位置時，記錄可能不會跟著保留。建議定期備份。</p><div class="controls"><button class="btn primary" onclick="exportData()">匯出 JSON 備份</button><label class="btn">匯入 JSON 備份<input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label></div></div><div class="card"><h2>延續使用的方法</h2><ol><li>將此 HTML 檔案放在固定資料夾。</li><li>使用同一個瀏覽器開啟。</li><li>每週完成學習後匯出一次 JSON。</li><li>若要換電腦，複製 HTML 並匯入 JSON。</li></ol></div>`}
renderDashboard();
</script></body></html>
